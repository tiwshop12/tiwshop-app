name: gauge   # ต้องตรงกับ --project-name ใน build-apk.yml (แพ็กเกจ Android = com.ftp.gauge)
description: TIWSHOP smart gauge app (BLE client for the TIWSHOP SMART GAUGE ESP32 K-Line gauge)
publish_to: none
version: 1.1.2+4   # TIWSHOP 1.1.0 (ยังเป็นแพ็กเกจ com.ftp.gauge = ติดตั้งทับแอพเดิมได้ ค่าเดิมไม่หาย) ; ออกรุ่นใหม่ให้เพิ่มเลขหลัง + ทุกครั้ง

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/bg.jpg
    - assets/logo.png
    - assets/splash.jpg
  fonts:
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/ethnocentric_rg.ttf
