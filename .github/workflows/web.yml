name: Website (Flutter web -> GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # push ไฟล์เว็บไปที่ branch gh-pages

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # โครงเว็บ (index.html / manifest / ไอคอน) สร้างอัตโนมัติ ไม่ทับโค้ดเรา
      - name: Generate web scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create . --platforms=web --project-name gauge --org com.ftp
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          rm -f test/widget_test.dart

      - name: Brand the website (ชื่อ / ไอคอน / ภาษาไทย)
        run: |
          python3 - <<'PY'
          import json, re
          p = 'web/index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<html>', '<html lang="th">')
          s = re.sub(r'<title>.*?</title>', '<title>TIWSHOP SMART GAUGE</title>', s, flags=re.S)
          s = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="TIWSHOP SMART GAUGE: ดูค่า จูน และเขียนกล่อง ECU ผ่านเว็บ">', s)
          s = s.replace('content="gauge"', 'content="TIWSHOP"')
          FS = '''
            <meta name="theme-color" content="#000000">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <style>html,body{background:#000;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}</style>
            <script>
            // เต็มจอแบบดูหนัง: แตะจอครั้งแรกแล้วเต็มจอ + ล็อกแนวนอน (Android Chrome) ; ปุ่มเต็มจอในแอพใช้ tiwFullscreenToggle
            (function () {
              var off = false;
              function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
              function standalone() { return window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone; }
              function enter() {
                var d = document.documentElement, r = d.requestFullscreen || d.webkitRequestFullscreen;
                if (!r || isFs()) return;
                try {
                  var p = r.call(d, { navigationUI: 'hide' });
                  if (p && p.then) p.then(function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }).catch(function () {});
                } catch (e) {}
              }
              function exit() { var x = document.exitFullscreen || document.webkitExitFullscreen; if (x && isFs()) x.call(document); }
              window.tiwFullscreenToggle = function () { if (isFs()) { off = true; exit(); } else { off = false; enter(); } };
              document.addEventListener('pointerup', function () { if (!off && !standalone()) enter(); }, { passive: true });
            })();
            </script>
          '''
          s = s.replace('</head>', FS + '</head>')
          open(p, 'w', encoding='utf-8').write(s)
          m = json.load(open('web/manifest.json', encoding='utf-8'))
          m.update(name='TIWSHOP SMART GAUGE', short_name='TIWSHOP', description='ดูค่า จูน และเขียนกล่อง ECU ผ่านเว็บ',
                   background_color='#000000', theme_color='#000000', orientation='landscape', display='fullscreen')
          json.dump(m, open('web/manifest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          pip install -q pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/icon.png').convert('RGBA')
          for s in (192, 512):
              im.resize((s, s), Image.LANCZOS).save(f'web/icons/Icon-{s}.png')
              im.resize((s, s), Image.LANCZOS).save(f'web/icons/Icon-maskable-{s}.png')
          im.resize((32, 32), Image.LANCZOS).save('web/favicon.png')
          PY

      - run: flutter pub get
      - run: flutter build web --release --base-href /tiwshop-app/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          publish_branch: gh-pages
          force_orphan: true
