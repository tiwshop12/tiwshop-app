name: Verify XDF parser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/xdf_dump_test.dart
      - name: Publish digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view xdf-verify >/dev/null 2>&1 || gh release create xdf-verify --title "xdf-verify (internal)" --notes "digest for parser verification" --prerelease
          gh release upload xdf-verify build/xdf_digest.txt --clobber
